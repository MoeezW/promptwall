services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: promptwall
      POSTGRES_PASSWORD: promptwall
      POSTGRES_DB: promptwall
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptwall -d promptwall"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.17.0
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

volumes:
  postgres-data:
