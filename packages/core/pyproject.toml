[project]
name = "promptwall"
version = "0.1.0"
description = "Production-grade LLM safety gateway with structured concurrent detector execution, reversible PII redaction, and reproducible benchmarks."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Moeez Waqas", email = "moeezwaqas@outlook.com" }]
dependencies = [
    "detect-secrets>=1.5.0",
    "en-core-web-sm",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "optimum[onnxruntime]>=2.1.0",
    "presidio-analyzer>=2.2.362",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "sqlmodel>=0.0.38",
    "structlog>=25.5.0",
    "transformers>=4.57.6",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.7",
    "pre-commit>=3.7",
    "alembic>=1.13",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptwall"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
force-exclude = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # incompatible with D211; we pick "no blank line before class docstring"
    "D213",   # incompatible with D212; we pick "summary on first line"
    "D107",   # __init__ docstring is redundant with the class docstring
    "COM812", # conflicts with ruff format
    "ISC001", # conflicts with ruff format
    "CPY001", # we have LICENSE; no per-file copyright headers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # asserts are the point
    "PLR2004", # magic numbers are fine in test data
    "D",       # docstrings not required in tests
    "ANN",     # annotations not required in tests
    "INP001",  # tests dir is not a package
]
"src/promptwall/cli.py" = ["T201"]    # print() allowed in CLI only
"benchmarks/**" = ["T201", "INP001"]  # benchmark scripts can print
"migrations/**" = [
    "D",      # docstrings not enforced on migrations
    "INP001", # versions/ isn't a package, that's by design
    "ANN",    # annotations not enforced on migrations
    "F401",   # sa / Sequence imports are present in the template even if unused
    "E501",   # raw SQL strings in migrations can be long
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]
# disallow_any_explicit is enforced via ruff ANN401 instead — mypy's
# version trips on pydantic's BaseModel metaclass even when our own code
# is Any-free.

# optimum and transformers ship type information inconsistently; treat
# them as untyped at the boundary so our code stays strict elsewhere.
[[tool.mypy.overrides]]
module = ["optimum.*", "transformers.*"]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_any_unimported = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config -q"
testpaths = ["tests"]
filterwarnings = [
    "error",
    # HuggingFace / transformers / torch chatter that's not actionable from our code.
    "ignore::UserWarning:huggingface_hub.*",
    "ignore::FutureWarning:transformers.*",
    "ignore::DeprecationWarning:transformers.*",
    "ignore::DeprecationWarning:optimum.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::DeprecationWarning:onnxruntime.*",
    "ignore:.*torch_dtype.* is deprecated:FutureWarning",
    # Torch / ONNX leave background resources that pytest catches at teardown.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["src/promptwall"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
